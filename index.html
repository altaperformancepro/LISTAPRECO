<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista de Preço Mantecorp</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f0f2f7;--card:#fff;--text:#1a1a2e;--text2:#666;--text3:#999;--border:#e8e8ec;--primary:#2563eb;--primary-light:#e8f0fe;--green:#137333;--green-light:#e6f4ea;--orange:#ea580c;--orange-light:#fff7ed}
body{background:var(--bg);font-family:'Inter',sans-serif;padding:0;margin:0;color:var(--text);-webkit-font-smoothing:antialiased}
.app{max-width:1000px;margin:0 auto;padding:12px}
.bar{height:4px;background:var(--primary)}
.header{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.header h1{font-size:18px;font-weight:900}
.header .sub{font-size:11px;color:var(--text3);margin-top:4px}
.section-label{font-size:11px;font-weight:800;color:var(--primary);letter-spacing:.5px;text-transform:uppercase;margin-bottom:6px}
.filter-row{margin-bottom:12px}
.filter-row select{width:100%;height:40px;border-radius:12px;border:1px solid var(--border);padding:0 12px;font-size:14px;font-weight:500;background:var(--card);color:var(--text);cursor:pointer}
.themes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.themes button{border:none;border-radius:999px;padding:6px 14px;font-size:12px;font-weight:700;color:#fff;cursor:pointer;transition:transform .1s}
.themes button:active{transform:translateY(1px)}
.themes button.active{box-shadow:0 0 0 3px rgba(37,99,235,.4)}
.icms-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
@media(min-width:640px){.icms-grid{grid-template-columns:repeat(5,1fr)}}
.icms-btn{display:flex;flex-direction:column;align-items:flex-start;padding:8px 10px;border-radius:12px;border:1px solid var(--border);background:var(--card);cursor:pointer;transition:all .15s}
.icms-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.icms-btn.active{border-color:var(--primary);background:rgba(37,99,235,.08)}
.icms-btn .rate{font-size:13px;font-weight:900}
.icms-btn.active .rate{color:var(--primary)}
.icms-btn .states{font-size:9px;color:var(--primary);opacity:.7;line-height:1.2}
.disc-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;border:1px solid var(--border);background:var(--card);margin-bottom:8px}
.disc-row .label{font-size:11px;font-weight:800;color:var(--primary)}
.disc-row .controls{margin-left:auto;display:flex;align-items:center;gap:6px}
.disc-row button{width:32px;height:32px;border-radius:8px;border:1px solid rgba(37,99,235,.3);background:var(--card);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.disc-row button:active{transform:translateY(1px)}
.disc-row .val{min-width:48px;text-align:center;font-weight:900;font-size:14px}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--card);border-radius:14px;padding:12px;border:1px solid var(--border);cursor:pointer;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;gap:8px}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.card.selected{outline:3px solid var(--primary);outline-offset:2px;background:rgba(37,99,235,.03)}
.card h3{font-size:14px;font-weight:800}
.card .apr{font-size:12px;color:var(--text2)}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:10px;padding:2px 6px;border-radius:6px;font-weight:600}
.tag-pos{background:var(--primary-light);color:var(--primary)}
.tag-age{background:var(--green-light);color:var(--green)}
.prices{display:grid;grid-template-columns:1fr 1px 1fr;margin-top:auto;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.price-col{display:flex;align-items:center;justify-content:space-between;padding:8px;gap:4px}
.price-col .info{display:flex;flex-direction:column;gap:2px}
.price-label{font-size:10px;font-weight:800;color:rgba(37,99,235,.6);text-transform:uppercase;letter-spacing:.5px}
.price-old{font-size:10px;color:var(--text3);text-decoration:line-through}
.price-val{font-size:13px;font-weight:900}
.price-div{background:var(--border)}
.toolbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-top:1px solid var(--border);padding:8px 12px;display:flex;gap:8px;z-index:50}
.toolbar button{flex:1;height:40px;border-radius:12px;border:1px solid var(--border);background:var(--card);font-size:12px;font-weight:500;cursor:pointer}
.toolbar button:active{transform:translateY(1px)}
.toolbar .share{background:var(--primary);color:#fff;border:none;font-weight:700}
.toolbar .clear{flex:none;width:40px;background:#eee;border:none}
.counter{font-size:11px;background:var(--card);border:1px solid var(--border);border-radius:4px;padding:1px 6px;font-family:monospace;color:var(--text3)}
</style>
</head>

<div class="app">
  <div class="header">

</div>

:"Aplique a solução nas narinas, conforme a necessidade","idade":"Crianças e Adultos","pf":36.07,"pmc":40.11,"pf_original":36.07,"pmc_original":40.11},{"id":68,"produto":"Rinosoro JET Infantil","apresentacao":"Frasco com 100mL","posologia":"Aplique a solução nas narinas, conforme a necessidade","idade":"Crianças e Adultos","pf":36.07,"pmc":50.14,"pf_original":36.07,"pmc_original":50.14},{"id":69,"produto":"Rinosoro JET XT Infantil","apresentacao":"Frasco com 100mL","posologia":"Aplique a solução nas narinas, conforme a necessidade","idade":"Crianças","pf":47.03,"pmc":57.99,"pf_original":47.03,"pmc_original":57.99},{"id":70,"produto":"Rinosoro Spray","apresentacao":"Spray nasal com 50mL","posologia":"Aplique a solução nas narinas, conforme a necessidade","idade":"Crianças e Adultos","pf":24.81,"pmc":29.39,"pf_original":24.81,"pmc_original":29.39},{"id":71,"produto":"Rinosoro Spray 3%","apresentacao":"Spray nasal com 50mL","posologia":"Aplique a solução nas narinas, conforme a necessidade","idade":"Crianças e Adultos","pf":24.81,"pmc":29.99,"pf_original":24.81,"pmc_original":29.99},{"id":72,"produto":"Rinosoro Spray Infantil","apresentacao":"Spray nasal com 50mL","posologia":"Aplique a solução nas narinas, conforme a necessidade","idade":"Crianças","pf":25.55,"pmc":29.99,"pf_original":25.55,"pmc_original":29.99},{"id":73,"produto":"Rinosoro Spray XT","apresentacao":"Spray nasal com 50mL","posologia":"Aplique a solução nas narinas, conforme a necessidade","idade":"Crianças e Adultos","pf":26.58,"pmc":36.57,"pf_original":26.58,"pmc_original":36.57},{"id":74,"produto":"Rinosoro Spray XT 3%","apresentacao":"Spray nasal com 50mL","posologia":"Aplique a solução nas narinas, conforme a necessidade","idade":"Crianças e Adultos","pf":27.68,"pmc":38.09,"pf_original":27.68,"pmc_original":38.09},{"id":75,"produto":"Rinosoro Spray XT Infantil","apresentacao":"Spray nasal com 50mL","posologia":"Aplique a solução nas narinas, conforme a necessidade","idade":"Crianças","pf":26.58,"pmc":36.57,"pf_original":26.58,"pmc_original":36.57},{"id":76,"produto":"Rinosoro XT Jet","apresentacao":"Frasco com 100mL","posologia":"Aplique a solução nas narinas, conforme a necessidade","idade":"Crianças e Adultos","pf":47.03,"pmc":57.99,"pf_original":47.03,"pmc_original":57.99},{"id":77,"produto":"RIZI","apresentacao":"5,0mg 10 Comprimidos Revestidos","posologia":"1 comprimido ao dia","idade":"A partir de 12 anos","pf":42.28,"pmc":56.72,"pf_original":42.28,"pmc_original":56.72},{"id":78,"produto":"RIZI","apresentacao":"5,0mg 30 Comprimidos Revestidos","posologia":"1 comprimido ao dia","idade":"A partir de 12 anos","pf":126.9,"pmc":170.23,"pf_original":126.9,"pmc_original":170.23},{"id":79,"produto":"RIZI-M","apresentacao":"10mg+5mg Comprimidos 7un","posologia":"1 comprimido ao dia (noite)","idade":"A partir de 18 anos","pf":54.44,"pmc":73.03,"pf_original":54.44,"pmc_original":73.03},{"id":80,"produto":"RIZI-M","apresentacao":"10mg+5mg Comprimidos 14un","posologia":"1 comprimido ao dia (noite)","idade":"A partir de 18 anos","pf":108.91,"pmc":146.1,"pf_original":108.91,"pmc_original":146.1}];
const ICMS_OPTIONS = [
  {rate:12,label:"12%",states:"MG (GEN), SP (GEN)"},
  {rate:17,label:"17%",states:"DF, ES, MT, MS, RS, SC"},
  {rate:18,label:"18%",states:"AP, MG, SP"},
  {rate:19,label:"19%",states:"AC, AL, GO, PA, SE"},
  {rate:19.5,label:"19,5%",states:"PR, RO"},
  {rate:20,label:"20%",states:"AM, CE, PB, RN, RR, TO"},
  {rate:20.5,label:"20,5%",states:"BA, PE"},
  {rate:22,label:"22%",states:"RJ"},
  {rate:22.5,label:"22,5%",states:"PI"},
  {rate:23,label:"23%",states:"MA"}
];
let icmsRate = 18, discPF = 0, discPMC = 0, familyFilter = "*", selectedIds = new Set();

function convertIcms(price, rate) {
  if (rate === 18) return price;
  return price * (1 - 18/100) / (1 - rate/100);
}
function moneyBR(n) { return n.toLocaleString("pt-BR",{style:"currency",currency:"BRL"}) }

// Build family filter
const families = [...new Set(products.map(p => p.produto.split(/\s+/)[0].toUpperCase()))].sort();
const sel = document.getElementById("familyFilter");
families.forEach(f => { const o = document.createElement("option"); o.value = f; o.textContent = f; sel.appendChild(o); });
sel.addEventListener("change", e => { familyFilter = e.target.value; render(); });

// Build ICMS grid
const icmsGrid = document.getElementById("icmsGrid");
ICMS_OPTIONS.forEach(opt => {
  const btn = document.createElement("button");
  btn.className = "icms-btn" + (opt.rate === icmsRate ? " active" : "");
  btn.innerHTML = '<span class="rate">' + opt.label + '</span><span class="states">' + opt.states + '</span>';
  btn.onclick = () => { icmsRate = opt.rate; render(); };
  icmsGrid.appendChild(btn);
});

// Build discounts
function buildDiscounts() {
  const c = document.getElementById("discounts");
  c.innerHTML = ["PF","PMC"].map(label => 
    '<div class="disc-row"><span class="label">% desconto ' + label + ':</span><div class="controls">' +
    '<button onclick="changeDisc(\'' + label + '\',-1)">−</button>' +
    '<span class="val" id="disc' + label + '">' + (label==="PF"?discPF:discPMC) + '%</span>' +
    '<button onclick="changeDisc(\'' + label + '\',1)">+</button></div></div>'
  ).join("");
}
window.changeDisc = (label, dir) => {
  if (label==="PF") discPF = Math.max(0, Math.min(95, discPF+dir));
  else discPMC = Math.max(0, Math.min(95, discPMC+dir));
  buildDiscounts(); render();
};
buildDiscounts();

function render() {
  const q = familyFilter;
  const list = products.filter(p => {
    if (q !== "*" && !p.produto.toUpperCase().startsWith(q)) return false;
    return true;
  });
  document.getElementById("counter").textContent = list.length + "/" + products.length + " itens";

  // ICMS buttons
  icmsGrid.querySelectorAll(".icms-btn").forEach((btn, i) => {
    btn.className = "icms-btn" + (ICMS_OPTIONS[i].rate === icmsRate ? " active" : "");
  });

  const grid = document.getElementById("grid");
  grid.innerHTML = list.map(p => {
    const pfAdj = convertIcms(p.pf, icmsRate);
    const pmcAdj = convertIcms(p.pmc, icmsRate);
    const pfOrig = convertIcms(p.pf_original, icmsRate);
    const pmcOrig = convertIcms(p.pmc_original, icmsRate);
    const pfVal = pfAdj * (1 - discPF/100);
    const pmcVal = pmcAdj * (1 - discPMC/100);
    const sel = selectedIds.has(p.id) ? " selected" : "";
    return '<div class="card' + sel + '" onclick="toggleSel(' + p.id + ')">' +
      '<h3>' + p.produto + '</h3>' +
      '<p class="apr">' + p.apresentacao + '</p>' +
      '<div class="tags">' +
        (p.posologia ? '<span class="tag tag-pos">💊 ' + p.posologia + '</span>' : '') +
        (p.idade ? '<span class="tag tag-age">👤 ' + p.idade + '</span>' : '') +
      '</div>' +
      '<div class="prices">' +
        '<div class="price-col"><div class="info"><span class="price-label">PF ' + icmsRate + '%</span><span class="price-old">' + moneyBR(pfOrig) + '</span></div><span class="price-val">' + moneyBR(pfVal) + '</span></div>' +
        '<div class="price-div"></div>' +
        '<div class="price-col"><div class="info"><span class="price-label">PMC ' + icmsRate + '%</span><span class="price-old">' + moneyBR(pmcOrig) + '</span></div><span class="price-val">' + moneyBR(pmcVal) + '</span></div>' +
      '</div></div>';
  }).join("");

  // Toolbar
  const tb = document.getElementById("toolbar");
  if (selectedIds.size > 0) {
    tb.innerHTML = '<button onclick="window.scrollTo({top:0,behavior:\'smooth\'})">Topo</button>' +
      '<button onclick="resetAll()">Redefinir</button>' +
      '<button class="share" onclick="shareWA()">📤 Enviar (' + selectedIds.size + ')</button>' +
      '<button class="clear" onclick="selectedIds.clear();render()">❌</button>';
  } else {
    tb.innerHTML = '<button onclick="window.scrollTo({top:0,behavior:\'smooth\'})">Topo</button>' +
      '<button onclick="resetAll()">Redefinir</button>';
  }
}

window.toggleSel = id => { selectedIds.has(id) ? selectedIds.delete(id) : selectedIds.add(id); render(); };
window.resetAll = () => { discPF=0; discPMC=0; icmsRate=18; familyFilter="*"; selectedIds.clear(); sel.value="*"; buildDiscounts(); render(); };
window.shareWA = () => {
  const items = products.filter(p => selectedIds.has(p.id));
  let msg = "*LISTA DE PREÇOS MANTECORP*\n\n";
  items.forEach(p => {
    const pmcAdj = convertIcms(p.pmc, icmsRate);
    const pmcVal = pmcAdj * (1 - discPMC/100);
    msg += "*" + p.produto + "*\n" + p.apresentacao + "\n- PMC (" + icmsRate + "%): R$ " + pmcVal.toFixed(2).replace(".",",") + "\n";
    if (p.posologia) msg += "- Posologia: " + p.posologia + "\n";
    if (p.idade) msg += "- Idade: " + p.idade + "\n";
    msg += "-------------------------\n";
  });
  msg += "— Mantecorp";
  window.open("https://wa.me/?text=" + encodeURIComponent(msg), "_blank");
};

render();
</script>
